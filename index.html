  <script>
    cytoscape.use(cytoscapeDagre);
    const elements = [{"data": {"id": "c161", "label": "Technology is Constitutive of International Relations", "db_id": 161, "type": "concept", "description": "Technology plays a crucial role in the building of political order, both domestic and international. Technology is constitutive of political order.", "parent_id": null, "sort_order": 10, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c156", "label": "Autopoiesis", "db_id": 156, "type": "concept", "description": "Self-producing, self-maintaining, and self-referential processes by which a system\u2014whether biological, artificial, or hybrid\u2014continuously generates, repairs, evolves or sustains its own organization, identity, and boundaries through closed loops of interaction with its environment.", "parent_id": null, "sort_order": 100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c158", "label": "Goal Setting", "db_id": 158, "type": "concept", "description": "Self-generates its own purposes and sub-goals.", "parent_id": 156, "sort_order": 120, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c159", "label": "Dynamic Boundary Maintenance", "db_id": 159, "type": "concept", "description": "The system actively defines and sustains its own boundaries (physical or logical) to distinguish itself from its environment.", "parent_id": 156, "sort_order": 130, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c160", "label": "Operational self-change", "db_id": 160, "type": "concept", "description": "Continuous learning and self-evolution.", "parent_id": 156, "sort_order": 140, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c157", "label": "Self-Production", "db_id": 157, "type": "concept", "description": "Rewrites its own architecture/code recursively.", "parent_id": 160, "sort_order": 110, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c123", "label": "System Architecture and Control", "db_id": 123, "type": "concept", "description": "Foundational structural and organizational attributes of technological systems and ecosystems. These can be intrinsic to the technology (as for blockchain) or socially constructed (as for centralized exercise of control and power).", "parent_id": null, "sort_order": 1000, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c124", "label": "Topology", "db_id": 124, "type": "concept", "description": "Technology: Physical/logical arrangement of nodes (e.g., star, mesh, hybrid) in distributed training or inference setups.. Example structural characteristics of techno-industrial ecosystem: Concentration of cloud infrastructure: Dominance by a few hyperscalers (AWS, Google, Microsoft) controlling ~70% of global cloud market. Vertical integration: Chip-to-cloud stacks (e.g., NVIDIA + AWS, Google TPUs + Google Cloud)..", "parent_id": 123, "sort_order": 1100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c125", "label": "Organizational Principles", "db_id": 125, "type": "concept", "description": "Technology: Structural principles defining control over AI systems: centralized (single authority), distributed (collaborative nodes), or decentralized (peer-to-peer).. Example structural characteristics of techno-industrial ecosystem: Oligopolistic market structure: 3 corporations (OpenAI, Google, Meta) control >80% of cutting-edge LLM development. State-backed alternatives: China\u2019s \"national champions\" (e.g., Baidu\u2019s ERNIE, Alibaba\u2019s Tongyi Qianwen)..", "parent_id": 123, "sort_order": 1200, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c126", "label": "Centralized", "db_id": 126, "type": "concept", "description": "Technology: Single authority controls training/data (e.g., OpenAI\u2019s GPT-4, Google\u2019s BERT).. Example structural characteristics of techno-industrial ecosystem: Monopolistic control: Single corporations (OpenAI, Google) act as gatekeepers for proprietary models and training data. Data extraction: Centralized collection of global user data (e.g., via APIs, web scraping)..", "parent_id": 125, "sort_order": 1210, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c128", "label": "Decentralized", "db_id": 128, "type": "concept", "description": "Technology: Peer-to-peer control (e.g., federated learning, blockchain-based AI).. Example structural characteristics of techno-industrial ecosystem: Niche adoption: Limited to privacy-sensitive sectors (e.g., healthcare, finance) or censorship-resistant use cases (e.g., Tor-based AI). Infrastructure dependencies: Still reliant on centralized cloud/GPU providers for training..", "parent_id": 125, "sort_order": 1215, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c127", "label": "Distributed", "db_id": 127, "type": "concept", "description": "Technology: Collaborative processing across nodes (e.g., Meta\u2019s LLaMA, EleutherAI\u2019s GPT-Neo).. Example structural characteristics of techno-industrial ecosystem: Fragmented open-source ecosystems: Decentralized contributions from global developer communities (e.g., Hugging Face, EleutherAI) but reliant on corporate-backed infrastructure (e.g., GitHub/Microsoft)..", "parent_id": 125, "sort_order": 1220, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c129", "label": "Modularity", "db_id": 129, "type": "concept", "description": "Technology: Interchangeable components (e.g., LoRA adapters, plug-and-play attention layers) enabling customization and scalability.. Example structural characteristics of techno-industrial ecosystem: Modular value chains: Specialized firms for components (e.g., NVIDIA for GPUs, Hugging Face for model hubs, Scale AI for data labeling). Platform lock-in: Proprietary modular frameworks (e.g., TensorFlow Extended) create vendor dependencies..", "parent_id": 123, "sort_order": 1300, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c130", "label": "Operational Dynamics and Dependencies", "db_id": 130, "type": "concept", "description": "System-level control, functional attributes, and systemic dependencies", "parent_id": null, "sort_order": 2000, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c131", "label": "System-Level Control", "db_id": 131, "type": "concept", "description": "Technology: Mechanisms for orchestrating AI training/inference (e.g., Kubernetes for distributed training, Ray for RLHF).. Example structural characteristics of techno-industrial ecosystem: Orchestration monopolies: Kubernetes (Google) and Ray (Anyscale) dominate AI workload management. Labor asymmetries: High demand for ML ops engineers concentrated in U.S./China..", "parent_id": 130, "sort_order": 2100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c132", "label": "Redundancy", "db_id": 132, "type": "concept", "description": "Technology: Duplicate components/functions for fault tolerance (e.g., multi-region LLM deployments, backup models).. Example structural characteristics of techno-industrial ecosystem: Redundancy as luxury: Only affordable for hyperscalers (e.g., Google\u2019s multi-region TPU clusters) or state-backed projects (e.g., U.S. DoD\u2019s AI resilience programs). Geographic concentration: Redundant data centers located in Global North (e.g., U.S., Ireland, Singapore)..", "parent_id": 130, "sort_order": 2200, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c133", "label": "Dependency Chains", "db_id": 133, "type": "concept", "description": "Technology: Supply chains for key assets and strategic resources (e.g., training data, GPUs, cloud services) introducing vulnerabilities or bottlenecks. Example structural characteristics of techno-industrial ecosystem: Critical bottlenecks: 1. GPUs: 90% market share held by NVIDIA (U.S.), with TSMC (Taiwan) as sole manufacturer. 2. Training data: Reliance on a few datasets (e.g., Common Crawl, Wikipedia). 3. Cloud services: AWS/Google/Azure control ~70% of global cloud market.", "parent_id": 130, "sort_order": 2300, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c134", "label": "Network Effects", "db_id": 134, "type": "concept", "description": "Technology: Value increases with more users/data (e.g., ChatGPT\u2019s virality, collaborative open-source model development).. Example structural characteristics of techno-industrial ecosystem: Winner-takes-all markets: Dominant platforms (OpenAI, Google) capture >90% of user/data network effects. Barriers to entry: High costs for new entrants to achieve critical mass (e.g., $100M+ to train a competitive LLM)..", "parent_id": 130, "sort_order": 2400, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c135", "label": "Consistency Models", "db_id": 135, "type": "concept", "description": "Technology: Guarantees for AI outputs (e.g., deterministic vs. probabilistic generation) affecting reliability and reproducibility.. Example structural characteristics of techno-industrial ecosystem: Industrial standardization: Corporations (Google, IBM) and consortia (ONNX, IEEE) set de facto standards. Regulatory capture: Tech giants influence consistency requirements (e.g., via lobbying in EU AI Act negotiations)..", "parent_id": 130, "sort_order": 2500, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c136", "label": "Observability", "db_id": 136, "type": "concept", "description": "Technology: Tools/methods for monitoring AI training/inference (e.g., logging, explainability tools like Weights & Biases).. Example structural characteristics of techno-industrial ecosystem: Observability as compliance tool: Adopted primarily by regulated industries (e.g., finance, healthcare) and large corporations (e.g., Google\u2019s AI explainability tools). Market fragmentation: Lack of universal observability standards..", "parent_id": 130, "sort_order": 2600, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c137", "label": "Security and Trust Mechanisms", "db_id": 137, "type": "concept", "description": "Protecting technological systems and ensuring legitimacy", "parent_id": null, "sort_order": 3000, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c138", "label": "(Cyber)Security", "db_id": 138, "type": "concept", "description": "Technology: Measures to protect AI from adversarial attacks (e.g., prompt injection), data poisoning, and model theft.. Example structural characteristics of techno-industrial ecosystem: Security industrial complex: Cybersecurity firms (e.g., CrowdStrike, Palo Alto) and cloud providers (AWS, Google) dominate AI security market. Asymmetric vulnerabilities: Smaller firms/Global South lack resources for robust security..", "parent_id": 137, "sort_order": 3100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c139", "label": "Privacy", "db_id": 139, "type": "concept", "description": "Technology: Mechanisms to protect user data in AI training/inference (e.g., differential privacy, federated learning).. Example structural characteristics of techno-industrial ecosystem: Privacy as premium feature: Only affordable for well-funded corporations (e.g., Google\u2019s federated learning, Apple\u2019s on-device LLMs). Regulatory arbitrage: Firms exploit weak privacy laws in Global South for data collection..", "parent_id": 137, "sort_order": 3200, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c140", "label": "Trust and Trustlessness", "db_id": 140, "type": "concept", "description": "Technology: Design choices enabling reliance on central authorities (e.g., OpenAI) vs. trustless verification (e.g., blockchain-based AI). These choices are often influenced by the organizational principles (e.g., centralized vs. decentralized systems) of the AI ecosystem. Example structural characteristics of techno-industrial ecosystem: Trustless niches: Limited to specific use cases (e.g., blockchain-based AI for finance, decentralized science). Centralized dominance: 99% of commercial AI relies on trusted third parties (e.g., cloud providers).", "parent_id": 137, "sort_order": 3300, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c141", "label": "Certified/Legitimate", "db_id": 141, "type": "concept", "description": "Technology: Compliance with regulations (e.g., EU AI Act) and industry standards (e.g., ISO/IEC AI guidelines).. Example structural characteristics of techno-industrial ecosystem: Certification oligopoly: A few firms (e.g., DNV, T\u00dcV) dominate AI certification markets. Compliance costs: SMEs struggle with certification expenses (e.g., \u20ac100K+ for EU AI Act compliance)..", "parent_id": 137, "sort_order": 3400, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c142", "label": "Governance, Norms, and Openness", "db_id": 142, "type": "concept", "description": "Normative frameworks + openness/collaboration as governance tools", "parent_id": null, "sort_order": 4000, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c143", "label": "Transparency", "db_id": 143, "type": "concept", "description": "Technology: Open disclosure of AI training data, architectures, and decision-making processes.. Example structural characteristics of techno-industrial ecosystem: Transparency as PR tool: Large corporations (e.g., OpenAI, Google) selectively disclose model cards/ethics reviews. Asymmetric transparency: Proprietary models (e.g., GPT-4) remain black boxes..", "parent_id": 142, "sort_order": 4100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c144", "label": "Accountability", "db_id": 144, "type": "concept", "description": "Technology: Mechanisms to assign responsibility for AI outputs (e.g., bias, hallucinations, misuse). Example structural characteristics of techno-industrial ecosystem: Accountability of private technology companies especially for use of their AI in matters of national security and foreign policy. Corporations create ethics boards (e.g., Google\u2019s AI Principles) but lack enforcement. Legal gaps: No clear liability for AI harms (e.g., LLM-generated misinformation).", "parent_id": 142, "sort_order": 4200, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c145", "label": "Value-Based", "db_id": 145, "type": "concept", "description": "Technology: Alignment with ethical/social values (e.g., fairness, sustainability) in AI design and deployment.. Example structural characteristics of techno-industrial ecosystem: Ethical AI as marketing: Corporations (e.g., Microsoft, IBM) promote \"responsible AI\" while lobbying against regulation. Labor exploitation: Underpaid data labelers (e.g., in Kenya, India) enable \"ethical\" AI..", "parent_id": 142, "sort_order": 4300, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c146", "label": "Bias and Fairness", "db_id": 146, "type": "concept", "description": "Technology: Techniques to mitigate bias in AI outputs (e.g., racial, gender, cultural) and ensure fair representation.. Example structural characteristics of techno-industrial ecosystem: Bias mitigation as PR: Corporations (e.g., IBM, Google) release bias tools (e.g., AI Fairness 360) but deploy biased systems (e.g., hiring algorithms). Data colonialism: Bias mitigation relies on Global North datasets..", "parent_id": 145, "sort_order": 4400, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c147", "label": "Jurisdictional and Territorial Sovereignty", "db_id": 147, "type": "concept", "description": "Technology: Legal and territorial authority over AI data, models, and infrastructure, often manifesting in areas such as data privacy and localization requirements. Example structural characteristics of techno-industrial ecosystem: Sovereignty as industrial policy: EU (GDPR, Gaia-X), U.S. (CLOUD Act), China (Cybersecurity Law) create fragmented legal regimes. Data localization: States (e.g., Russia, India) mandate local data storage.", "parent_id": 142, "sort_order": 4500, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c148", "label": "Open Source", "db_id": 148, "type": "concept", "description": "Technology: Publicly accessible AI code, models, and datasets (e.g., Hugging Face\u2019s Transformers, Meta\u2019s LLaMA).. Example structural characteristics of techno-industrial ecosystem: Open-source as corporate tool: Meta (LLaMA), Google (BERT) release \"open\" models but retain control over key infrastructure. Labor exploitation: Unpaid open-source contributors enable corporate profits..", "parent_id": 142, "sort_order": 4600, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c149", "label": "Open Standards", "db_id": 149, "type": "concept", "description": "Technology: Public standards for AI interoperability (e.g., ONNX, Hugging Face\u2019s model hub).. Example structural characteristics of techno-industrial ecosystem: Standards as corporate battleground: Tech giants (Microsoft, Google) push proprietary standards (e.g., ONNX) while open alternatives (e.g., Apache ML) struggle for adoption. Regulatory capture: Corporations shape \"open\" standards via consortia (e.g., Linux Foundation)..", "parent_id": 142, "sort_order": 4700, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c150", "label": "Key Assets and Strategic Resources", "db_id": 150, "type": "concept", "description": "Critical resources underpinning technological systems, subject to geopolitical competition", "parent_id": null, "sort_order": 5000, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c151", "label": "Training Data", "db_id": 151, "type": "concept", "description": "Technology: Datasets used for LLM training (e.g., Common Crawl, proprietary corpora).. Example structural characteristics of techno-industrial ecosystem: Data oligopolies: A few corporations (Google, Meta, OpenAI) control most high-quality training data. Extractive practices: Scraping Global South data without compensation (e.g., African languages underrepresented in Common Crawl)..", "parent_id": 150, "sort_order": 5100, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c152", "label": "Compute Resources", "db_id": 152, "type": "concept", "description": "Technology: Hardware for AI training/inference (e.g., NVIDIA GPUs, Google TPUs, TPU pods).. Example structural characteristics of techno-industrial ecosystem: Semiconductor dependency: 90% of advanced AI chips manufactured by TSMC (Taiwan) using U.S./EU/IP tools. Cloud concentration: 3 hyperscalers (AWS, Google, Microsoft) control ~70% of AI compute capacity..", "parent_id": 150, "sort_order": 5200, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c153", "label": "Models and Algorithms", "db_id": 153, "type": "concept", "description": "Technology: Pre-trained models (e.g., GPT-4, LLaMA) and proprietary algorithms as intellectual property.. Example structural characteristics of techno-industrial ecosystem: Model monopolies: 3 corporations (OpenAI, Google, Meta) control >90% of cutting-edge LLMs. IP regimes: Patents and trade secrets protect proprietary algorithms (e.g., Google\u2019s PaLM, OpenAI\u2019s GPT-4)..", "parent_id": 150, "sort_order": 5300, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c154", "label": "People/Talent", "db_id": 154, "type": "concept", "description": "Technology: (No technical description\u2014this is a strategic resource, not a technical attribute of genAI/LLMs.). Example structural characteristics of techno-industrial ecosystem: Talent concentration: 60% of top AI researchers located in U.S. (Stanford, MIT, FAANG labs). Brain drain: Global South and EU lose talent to U.S./China (e.g., African AI researchers to Silicon Valley). Labor hierarchies: Low-wage data labelers (e.g., in Kenya, India) vs. high-paid AI researchers..", "parent_id": 150, "sort_order": 5400, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c165", "label": "Socio-Technical Innovation Ecosystem", "db_id": 165, "type": "concept", "description": "A socio-technical innovation ecosystem is a dynamic, interconnected system where:\n\nTechnological artifacts (e.g., AI, EVs, semiconductors) are developed and deployed.\nSocial actors (users, workers, communities, civil society) interact with and shape these technologies.\nInstitutions (laws, norms, standards, policies) govern how technologies are designed, used, and regulated.\nInfrastructures (digital, physical, organizational) enable or constrain innovation.\nKnowledge flows (R&D, education, informal learning) drive iterative improvement.", "parent_id": 150, "sort_order": 5500, "domain": "technology"}, "classes": "concept technology"}, {"data": {"id": "c162", "label": "International Relations is Constitutive of Technology", "db_id": 162, "type": "concept", "description": "International relations play a crucial role in the construction and building of technology. International order is constitutive of technology and its related techno-industrial ecosystem.", "parent_id": null, "sort_order": 8999, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c91", "label": "Sovereignty", "db_id": 91, "type": "concept", "description": "The ability to decide and act upon the own future as a country or alliance of countries in economy, society, political system, and defense. It is the ultimate condition of self-determination and independent action as a country or alliance of countries.", "parent_id": null, "sort_order": 9000, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c92", "label": "Strategic Autonomy", "db_id": 92, "type": "concept", "description": "Having the active competences, capacities and control to decide on own future as a country or alliance of countries in economy, society, political system (such as democracy) and defense. Strategic autonomy is a fundamental means to realize and safeguard sovereignty.", "parent_id": 91, "sort_order": 9100, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c93", "label": "Technological Sovereignty", "db_id": 93, "type": "concept", "description": "The country achieving technological sovereignty and reducing dependency on foreign sources for critical technologies. This includes strategic autonomy in key technological areas.", "parent_id": 92, "sort_order": 9110, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c94", "label": "EU Technological Sovereignty", "db_id": 94, "type": "concept", "description": "The EU ('Europe') achieving technological sovereignty and reducing dependency on non-European sources for critical technologies. This includes strategic autonomy in key technological areas.", "parent_id": 93, "sort_order": 9111, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c97", "label": "National Security", "db_id": 97, "type": "concept", "description": "National security is the protection of a state\u2019s core values\u2014territorial integrity, political sovereignty, and societal well-being\u2014from existential threats, which can be military, political, economic, societal, or environmental.", "parent_id": 91, "sort_order": 9200, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c95", "label": "Economic Security", "db_id": 95, "type": "concept", "description": "Protecting economic security by identifying and addressing critical vulnerabilities in supply chains. This assumes that proactive measures can safeguard economic interests and ensure resilience against potential disruptions.", "parent_id": 97, "sort_order": 9210, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c98", "label": "Competitiveness & Security", "db_id": 98, "type": "concept", "description": "Fostering a culture of innovation and research, particularly in key technologies, such as artificial intelligence (AI) in order to maintain competitiveness in the global technology race and maintain security in international relations.", "parent_id": null, "sort_order": 10000, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c102", "label": "Technology Governance & Policy Tools", "db_id": 102, "type": "concept", "description": "The frameworks, mechanisms, and instruments used by states or collaborations of states to guide, regulate, and influence the development, deployment, and impact of technologies, particularly those with strategic implications for international relations, national and global security, and innovation and competitiveness.", "parent_id": 98, "sort_order": 10100, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c96", "label": "Dual-Use", "db_id": 96, "type": "concept", "description": "The approach to develop and apply certain technologies for both civilian and defense purposes, that is, dual-use as a policy tool. This assumes that technological advancements can be leveraged for both economic and security benefits.", "parent_id": 102, "sort_order": 10110, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c99", "label": "Talent Attraction and Building Skills ", "db_id": 99, "type": "concept", "description": "Building a skilled workforce through education and training programs. This assumes that it is important to invest in human capital and ensure that the workforce is equipped with the necessary skills or talent attraction to drive technological advancement.", "parent_id": 102, "sort_order": 10120, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c100", "label": "Regulatory and Ethical Frameworks", "db_id": 100, "type": "concept", "description": "Regulatory frameworks and ethical considerations in the development and deployment of specific technologies. This assumes the importance of responsible innovation and ensuring that technological advancements are aligned with societal values and ethical standards.", "parent_id": 102, "sort_order": 10130, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c101", "label": "Standardization", "db_id": 101, "type": "concept", "description": "Process of developing and implementing technical, procedural, or qualitative norms to ensure consistency, interoperability, and quality across products, services, or systems. often through agreed-upon rules or specifications", "parent_id": 102, "sort_order": 10140, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c103", "label": "Investment", "db_id": 103, "type": "concept", "description": "Policies and programmes to promote investment to stimulate innovation and competitiveness", "parent_id": 102, "sort_order": 10150, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c107", "label": "International Cooperation", "db_id": 107, "type": "concept", "description": "International cooperation of two or more countries. This assumes benefits to partnerships and collaboration in advancing common goals.", "parent_id": null, "sort_order": 11000, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c106", "label": "Multilateral collaboration / multilateralism", "db_id": 106, "type": "concept", "description": "Collaboration of three or more countries. This assumes the power of coordinated efforts to achieve common goals.", "parent_id": 107, "sort_order": 11100, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c105", "label": "Likeminded Collaboration", "db_id": 105, "type": "concept", "description": "Collaboration among like-minded countries, often driven by shared values and strategic interests, to achieve common goals. This primarily refers to coordinated efforts among ideologically aligned states in the international arena.", "parent_id": 106, "sort_order": 11110, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c104", "label": "EU Internal Collaboration", "db_id": 104, "type": "concept", "description": "Multilateral collaboration among EU Member States, as well as between the public and private sectors in the EU. This assumes the power of coordinated efforts to achieve common goals.", "parent_id": 105, "sort_order": 11111, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c119", "label": "Multistakeholderism", "db_id": 119, "type": "concept", "description": "Multistakeholderism is a governance principle and practice that emphasizes the inclusive participation of diverse actors in decision-making processes, particularly in global, regional, or sectoral contexts. It is rooted in the idea that no single actor (e.g., states, corporations, or civil society) can address complex challenges alone, and that collaborative, transparent, and equitable engagement among all relevant stakeholders leads to more legitimate, effective, and sustainable outcomes.", "parent_id": 107, "sort_order": 11200, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c115", "label": "International Order", "db_id": 115, "type": "concept", "description": "Provides a clear, semantically coherent grouping for different models and characteristics of the international system, including structures and processes, which is crucial for understanding the geopolitical context of key technologies.", "parent_id": null, "sort_order": 12000, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c90", "label": "Human rights", "db_id": 90, "type": "concept", "description": "Universal, inalienable rights and freedoms that belong to all individuals by virtue of their humanity, regardless of nationality, ethnicity, gender, or other status", "parent_id": 115, "sort_order": 12100, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c89", "label": "Inclusivity and Diversity", "db_id": 89, "type": "concept", "description": "Addressing gender gaps and promoting diversity in the workforce. This assumes the importance of inclusivity and equal opportunities.", "parent_id": 90, "sort_order": 12110, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c108", "label": "Global common interests and institutions", "db_id": 108, "type": "concept", "description": "An international order characterized by shared global interests, and the prevalence of international institutions and international frameworks fostering collaboration and coordinated efforts to achieve common goals. This assumes the power of unity and coordinated efforts to achieve common global goals.", "parent_id": 115, "sort_order": 12200, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c120", "label": "Sustainable Development Goals (SDGs)", "db_id": 120, "type": "concept", "description": "The SDGs, or Sustainable Development Goals, are a collection of 17 interlinked global goals designed to be a \"blueprint to achieve a better and more sustainable future for all.\"\n\nAdopted by all 193 United Nations Member States in 2015, they are the core of the 2030 Agenda for Sustainable Development.", "parent_id": 108, "sort_order": 12210, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c109", "label": "Neoliberalism", "db_id": 109, "type": "concept", "description": "Policy paradigm emphasizing market-driven economic order, that is, free-market capitalism, deregulation, privatization, and reduced government intervention in the economy, often on a global scale.", "parent_id": 115, "sort_order": 12300, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c113", "label": "Corporate-centric, market-driven, neoliberalist international order", "db_id": 113, "type": "concept", "description": "The international order is mainly driven by large corporates like big tech", "parent_id": 109, "sort_order": 12310, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c110", "label": "Hegemony", "db_id": 110, "type": "concept", "description": "Dominance or leadership of one state over others in the international system. Less powerful states must go for geopolitical alignment and become part of the sphere of influence of the hegemon.", "parent_id": 115, "sort_order": 12400, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c111", "label": "Multipolarity", "db_id": 111, "type": "concept", "description": "A world order where power is distributed among multiple major states or blocs, contrary to hegemony ", "parent_id": 115, "sort_order": 12500, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c163", "label": "Multi-level governance", "db_id": 163, "type": "concept", "description": "Multi-level governance integrates subsidiarity and multi-tiered sovereignty to enable regulatory coordination across local, national, and global levels, reconciling national sovereignty and transnational cooperation. A prime example is the EU.", "parent_id": 111, "sort_order": 12510, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c112", "label": "State-centric international order", "db_id": 112, "type": "concept", "description": "The international order is mainly state-driven, state-centric", "parent_id": 115, "sort_order": 12600, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c116", "label": "Geopolitization", "db_id": 116, "type": "concept", "description": "The framing by a state of issues as contests of power between states, often leading to a securitization of economic or technological matters.", "parent_id": 112, "sort_order": 12610, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c117", "label": "Geo-economics", "db_id": 117, "type": "concept", "description": "The leveraging by a state of economic tools like trade, investment, and sanctions as strategic instruments to achieve geopolitical goals.", "parent_id": 112, "sort_order": 12620, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c118", "label": "Weaponization of Interdependence/Assets", "db_id": 118, "type": "concept", "description": "The act of a state turning non-military assets (e.g., supply chains, technology, financial systems, media) into tools of coercion or influence to achieve geopolitical goals.", "parent_id": 112, "sort_order": 12630, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c164", "label": "International Law", "db_id": 164, "type": "concept", "description": "A body of rules, principles, and institutions that govern relations between states and other international actors, derived from treaties, customary practices, and judicial decisions. It provides the legal basis for cooperation, conflict resolution, and the enforcement of global norms, shaping the behavior of states and non-state actors in both traditional and emerging domains (e.g., cybersecurity, climate change). This is the jus cogens interpretation of international law namely as  structuring of international relations affecting hierarchy, legitimacy, and enforcement impacting state sovereignty.", "parent_id": 115, "sort_order": 12700, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c121", "label": "Colonialism", "db_id": 121, "type": "concept", "description": "Global power structure characterized by the systematic domination, exploitation, and subjugation of territories, peoples, and resources including data by imperial or neo-colonial states and actors. \nModern colonialism is not confined to formal territorial occupation but includes\neconomic extraction (e.g., unequal trade, debt dependency, resource plundering), political interference (e.g., regime change, puppet governments, conditional aid), cultural hegemony (e.g., imposition of Western norms, erasure of Indigenous knowledge), technological and digital domination (e.g., data colonialism, AI-driven surveillance), military and security control (e.g., foreign military bases, private military contractors).", "parent_id": 115, "sort_order": 12800, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c122", "label": "Digital colonialism", "db_id": 122, "type": "concept", "description": "Exploitative, extractive, and hierarchical power dynamics of historical colonialism replicated by means of digital technologies, platforms, and infrastructures. It refers to the systematic control, extraction, and monopolization of digital resources, data, and infrastructure by dominant states, corporations, and institutions (primarily from the Global North), which perpetuates dependency, inequality, and cultural erasure in the Global South and marginalized communities. Digital colonialism operates through data extraction (e.g., harvesting user data without consent or compensation), platform monopolies (e.g., dominance of U.S./Chinese tech giants in global markets), algorithmic bias (e.g., AI systems trained on Western datasets that marginalize non-Western cultures), infrastructural dependency (e.g., reliance on foreign-owned cloud services, underwater cables, or satellite networks), cultural homogenization (e.g., imposition of Western digital norms, languages, and content), surveillance and control (e.g., export of authoritarian tech to suppress dissent in former colonies).", "parent_id": 121, "sort_order": 13100, "domain": "ir"}, "classes": "concept ir"}, {"data": {"id": "c166", "label": "Middle Powers Alliances", "db_id": 166, "type": "concept", "description": "Middle power alliances refer to strategic coalitions or partnerships among states that possess moderate levels of economic, military, diplomatic, and soft power influence\u2014neither dominant like great powers nor marginalized like small states.", "parent_id": 115, "sort_order": null, "domain": ""}, "classes": "concept"}, {"data": {"id": "ce158", "source": "c156", "target": "c158", "child_db_id": 158, "parent_db_id": 156, "type": "parent_child"}, "classes": "parent-edge"}, {"data": {"id": "ce159", "source": "c156", "target": "c159", "child_db_id": 159, "parent_db_id": 156, "type":       let h = '';

        const meta = [];
        if (d.parent_id)   meta.push('Parent ID: ' + d.parent_id);
        if (d.sort_order != null) meta.push('Sort Order: ' + d.sort_order);
        if (d.domain)      meta.push('Domain: ' + d.domain);
        if (meta.length) {
